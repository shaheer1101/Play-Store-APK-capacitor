<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Aneela's MakeOver</title>
  <meta name="description" content="A luxury salon mobile experience featuring premium makeup services, a beauty academy, and AI-powered beauty consultations. Perfection in Every Stroke.">
  <meta name="theme-color" content="#0A2419">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Aneela's">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/svg+xml" href="/icon.svg">
  <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script>
    // Permanently suppress Netlify HUD and badge widget
    try {
      localStorage.setItem("nl-hud:public:v1", "hidden");
      localStorage.setItem("nl-hud:owner-private:v1", "hidden");
    } catch (e) {}

    const removeNetlifyHUD = () => {
      document.querySelectorAll('#nl-badge-frame, #nl-hud-frame, iframe[id^="nl-"]').forEach(f => f.remove());
    };
    if (typeof window !== 'undefined') {
      window.addEventListener('DOMContentLoaded', removeNetlifyHUD);
      const observer = new MutationObserver(() => removeNetlifyHUD());
      observer.observe(document.documentElement, { childList: true, subtree: true });
    }
  </script>
  <style>
    /* Complete suppression of Netlify HUD / badge elements */
    #nl-badge-frame,
    #nl-hud-frame,
    iframe[id^="nl-"],
    iframe[src*="netlify"],
    [data-netlify-site-id] {
      display: none !important;
      visibility: hidden !important;
      opacity: 0 !important;
      pointer-events: none !important;
      position: absolute !important;
      top: -9999px !important;
      left: -9999px !important;
      width: 0 !important;
      height: 0 !important;
    }
    body {
      font-family: 'Poppins', sans-serif;
      background-color: #0A2419;
      color: #FFFFFF;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      overscroll-behavior-y: none; /* Prevents pull-to-refresh on mobile for app-like feel */
    }
    h1, h2, h3, h4, h5, h6, .serif {
      font-family: 'Playfair Display', serif;
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    .champagne-gold {
      color: #F7E7CE;
    }
    .gold-gradient {
      background: linear-gradient(135deg, #F7E7CE, #E1B84F, #C9A23A);
    }
    .green-gradient {
      background: linear-gradient(180deg, #0A2419, #05140D);
    }
    .glass-card {
      background: rgba(18, 76, 52, 0.4);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(247, 231, 206, 0.1);
      transition: all 0.4s ease;
    }
    .glow-gold {
      box-shadow: 0 0 15px rgba(247, 231, 206, 0.15);
      border: 1px solid rgba(247, 231, 206, 0.2);
    }
    .glow-gold:hover {
      box-shadow: 0 0 25px rgba(247, 231, 206, 0.3);
      border: 1px solid rgba(247, 231, 206, 0.5);
    }
    .btn-royal {
      background: linear-gradient(135deg, #F7E7CE, #E1B84F);
      color: #0A2419;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .btn-royal:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px -5px rgba(225, 184, 79, 0.4);
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-royal {
      animation: fadeIn 0.8s ease-out forwards;
    }
  </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.4",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/",
    "@google/genai": "https://esm.sh/@google/genai@^1.39.0",
    "lucide-react": "https://esm.sh/lucide-react@^0.563.0",
    "canvas-confetti": "https://esm.sh/canvas-confetti@^1.9.4",
    "firebase/": "https://esm.sh/firebase@^12.8.0/",
    "vite": "https://esm.sh/vite@^7.3.1",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.3"
  }
}
</script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
